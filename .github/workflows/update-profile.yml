name: Update profile

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
  push:
    branches: [main]
    paths:
      - profile.config.json
      - scripts/build-profile.mjs
      - scripts/personal-panels.mjs
      - scripts/update-stats.mjs
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh statistics
        run: node scripts/update-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build profile
        run: node scripts/build-profile.mjs
      - name: Save generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md profile/generated
          if [ -f profile/stats.json ]; then git add profile/stats.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh profile'
          git push
