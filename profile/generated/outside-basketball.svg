<svg xmlns="http://www.w3.org/2000/svg" width="440" height="180" viewBox="0 0 440 180" role="img" aria-labelledby="title"><title id="title">Basketball: On the court, or following the NBA.</title><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Menlo,Consolas,monospace}.bounce{animation:bounce 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.spin{animation:spin 7s linear infinite;transform-box:fill-box;transform-origin:center}.flash{animation:flash 4s ease-in-out infinite}.blink{animation:blink 2.4s steps(1,end) infinite}@keyframes bounce{0%,100%{transform:translateY(-9px)}48%{transform:translateY(10px)}55%{transform:translateY(8px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes flash{0%,30%,48%,100%{opacity:1}36%,41%{opacity:.22}}@keyframes blink{0%,48%{opacity:1}49%,100%{opacity:.12}}@media(prefers-reduced-motion:reduce){.bounce,.spin,.flash,.blink{animation:none!important;transform:none!important;opacity:1!important}}</style><rect x=".5" y=".5" width="439" height="179" rx="10" fill="#0A0A0A" stroke="#262626"/><text x="28" y="30" font-size="11" fill="#A3A3A3" letter-spacing=".6">02 / PLAY</text><g fill="none" stroke="#FAFAFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M34 140h76" opacity=".3"/><g class="bounce"><circle cx="72" cy="96" r="29"/><path d="M43 96h58M72 67v58M52 75q34 21 40 41M92 75q-34 21-40 41"/></g></g><text x="145" y="82" font-size="25" fill="#FAFAFA" letter-spacing="-.5">Basketball</text><text x="145" y="112" font-size="14" fill="#A3A3A3" >On the court, or following</text><text x="145" y="133" font-size="14" fill="#A3A3A3" >the NBA.</text></svg>
