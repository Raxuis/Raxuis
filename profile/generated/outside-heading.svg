<svg xmlns="http://www.w3.org/2000/svg" width="880" height="68" viewBox="0 0 880 68" role="img" aria-labelledby="title"><title id="title">Outside of coding</title><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Menlo,Consolas,monospace}.bounce{animation:bounce 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.spin{animation:spin 7s linear infinite;transform-box:fill-box;transform-origin:center}.flash{animation:flash 4s ease-in-out infinite}.blink{animation:blink 2.4s steps(1,end) infinite}@keyframes bounce{0%,100%{transform:translateY(-9px)}48%{transform:translateY(10px)}55%{transform:translateY(8px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes flash{0%,30%,48%,100%{opacity:1}36%,41%{opacity:.22}}@keyframes blink{0%,48%{opacity:1}49%,100%{opacity:.12}}@media(prefers-reduced-motion:reduce){.bounce,.spin,.flash,.blink{animation:none!important;transform:none!important;opacity:1!important}}</style><rect x=".5" y=".5" width="879" height="67" rx="10" fill="#0A0A0A" stroke="#262626"/><text x="28" y="41" font-size="25" fill="#FAFAFA" letter-spacing="-.6">Outside of coding</text><text x="852" y="40" font-size="11" fill="#A3A3A3" text-anchor="end" class="mono" letter-spacing=".5">A LITTLE LESS SCREEN TIME</text></svg>
